spring:
  application:
    name: ems-gap-filler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/energymanagementsystem}
    username: ${DB_USER:ems_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  flyway:
    enabled: true
    schemas: ems
    default-schema: ems
    table: ems_gap_filler_flyway_history
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ems-gap-filler

gapfiller:
  recent:
    enabled: true            # false (env GAPFILLER_RECENT_ENABLED=false) => NAO roda o sweep RECENT
    cron: "0 5/15 * * * *"   # de 15 em 15 min: :05, :20, :35, :50 (5 min apos o refresh do CAG hourly em :00/:15/:30/:45)
    window-hours: 24         # re-varre as ultimas 24h a cada ciclo (idempotente; tunavel via GAPFILLER_RECENT_WINDOW_HOURS)
  historical:
    enabled: true            # false (env GAPFILLER_HISTORICAL_ENABLED=false) => NAO drena a fila; POST /backfill fica QUEUED sem processar
    max-window-days: 730     # 2 anos - alinha com CAG monthly start_offset
    parallel-sensors: 5
  ftp:
    timeout-seconds: 30
    retry-attempts: 3
    retry-backoff-seconds: 5
  carlo-gavazzi:
    timeout-seconds: 15

logging:
  level:
    root: INFO
    br.com.ledstar.ems.gapfiller: DEBUG
    org.flywaydb: INFO
    net.javacrumbs.shedlock: INFO
