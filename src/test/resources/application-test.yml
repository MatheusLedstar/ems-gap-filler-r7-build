# Profile "test" - usado pelos testes de integracao (Testcontainers).
# A URL/usuario/senha do datasource sao injetados via @DynamicPropertySource
# (ver IntegrationTestBase). Aqui ficam so os ajustes de comportamento.
# O GapFillerScheduler e @Profile("!test") -> nao e carregado aqui, entao nenhum
# @Scheduled dispara durante a suite (nao precisa de toggle de scheduling).
spring:
  flyway:
    baseline-on-migrate: true

gapfiller:
  recent:
    enabled: false
  crypto:
    pgp-key: ""        # senhas FTP em texto puro nos testes (sem pgp_sym_decrypt)

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.flywaydb: INFO
    br.com.ledstar.ems.gapfiller: DEBUG
